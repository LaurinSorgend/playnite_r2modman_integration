Type: Generic
Name: 'r2modman Launch Options'
Author: 'Laurin Sorgend'
ShortDescription: 'Adds launch entries for r2modman and Gale profiles to supported Steam games.'
Description: 'Reads r2modman and Gale profiles from disk and adds them as launch options on supported Steam games, so you can pick a modded profile from the Play menu. Profiles are read live, so there is nothing to keep in sync. r2modman profiles launch through Steam with Doorstop arguments and cover BepInEx 5 and 6 games via Doorstop 3 and 4. Gale profiles launch through Gale''s command line, so any mod loader Gale supports works. Game support is generated from the upstream game lists of both mod managers, and r2modman mappings can be extended with manual overrides in the settings.'
