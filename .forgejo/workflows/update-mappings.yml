name: update-mappings
on:
  workflow_dispatch:
  schedule:
    # Daily at 04:17 UTC.
    - cron: '17 4 * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/update_game_mappings.py'
      - '.forgejo/workflows/update-mappings.yml'
      - 'src/PlayniteR2modman/Resources/r2modman_games.json'
  pull_request:
    paths:
      - 'scripts/update_game_mappings.py'
      - 'src/PlayniteR2modman/Resources/r2modman_games.json'

jobs:
  sync-mappings:
    runs-on: docker
    steps:
      - name: Checkout
        uses: https://code.forgejo.org/actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.ref || 'main' }}

      - name: Mark workspace as safe for git
        shell: bash
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install Python
        shell: bash
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y python3 python3-pip
          ln -sf /usr/bin/python3 /usr/local/bin/python

      - name: Run extractor
        run: python scripts/update_game_mappings.py

      - name: Commit and push refreshed mapping
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          PUSH_TOKEN: ${{ secrets.MAPPINGS_PUSH_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mapping=src/PlayniteR2modman/Resources/r2modman_games.json
          if git diff --quiet -- "$mapping"; then
            echo "Mapping is already in sync with upstream ecosystem.json."
            exit 0
          fi
          if [ -z "${PUSH_TOKEN:-}" ]; then
            echo "::error::No push token available; set the MAPPINGS_PUSH_TOKEN secret."
            exit 1
          fi
          git config user.name "forgejo-actions[bot]"
          git config user.email "forgejo-actions[bot]@noreply.codeberg.org"
          git add "$mapping"
          git commit -m "Update r2modman game mappings [skip ci]"
          origin="${GITHUB_SERVER_URL#https://}"
          git push "https://x-access-token:${PUSH_TOKEN}@${origin}/${GITHUB_REPOSITORY}.git" HEAD:main

      - name: Fail if bundled mapping is out of date
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          if ! git diff --exit-code -- src/PlayniteR2modman/Resources/r2modman_games.json; then
            echo "::error::r2modman_games.json is out of sync with upstream ecosystem.json."
            echo "Run 'python scripts/update_game_mappings.py' locally and commit the result."
            exit 1
          fi
