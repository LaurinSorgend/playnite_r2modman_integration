name: update-mappings
on:
  workflow_dispatch:
  schedule:
    # Daily at 04:17 UTC.
    - cron: '17 4 * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/update_game_mappings.py'
      - '.forgejo/workflows/update-mappings.yml'
      - 'src/PlayniteR2modman/Resources/r2modman_games.json'
  pull_request:
    paths:
      - 'scripts/update_game_mappings.py'
      - 'src/PlayniteR2modman/Resources/r2modman_games.json'

jobs:
  sync-mappings:
    runs-on: docker
    steps:
      - name: Checkout
        uses: https://code.forgejo.org/actions/checkout@v4

      - name: Mark workspace as safe for git
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "${FORGEJO_WORKSPACE:?}"

      - name: Install Python
        shell: bash
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y python3 python3-pip
          ln -sf /usr/bin/python3 /usr/local/bin/python

      - name: Run extractor
        run: python scripts/update_game_mappings.py

      - name: Sync refreshed mapping
        shell: bash
        env:
          FORGEJO_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
        run: |
          set -euo pipefail
          mapping=src/PlayniteR2modman/Resources/r2modman_games.json
          if git diff --quiet -- "$mapping"; then
            echo "Mapping is already in sync with upstream ecosystem.json."
            exit 0
          fi
          if [ "${FORGEJO_EVENT_NAME:?}" = "pull_request" ]; then
            git diff -- "$mapping"
            echo "::error::r2modman_games.json is out of sync with upstream ecosystem.json."
            echo "Run 'python scripts/update_game_mappings.py' locally and commit the result."
            exit 1
          fi
          if [ -z "${FORGEJO_TOKEN:-}" ]; then
            echo "::error::No automatic token available; cannot push the refreshed mapping."
            exit 1
          fi
          git config user.name "forgejo-actions"
          git config user.email "forgejo-actions@noreply.codeberg.org"
          git commit -q -m "Update r2modman game mappings" -- "$mapping"
          host="${FORGEJO_SERVER_URL:?}"
          git push "https://forgejo-actions:${FORGEJO_TOKEN}@${host#https://}/${FORGEJO_REPOSITORY:?}.git" HEAD:main
