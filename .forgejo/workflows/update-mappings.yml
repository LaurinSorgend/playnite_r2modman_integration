name: update-mappings
on:
  workflow_dispatch:
  schedule:
    # Daily at 04:17 UTC.
    - cron: '17 4 * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/update_game_mappings.py'
      - 'scripts/update_gale_game_mappings.py'
      - 'scripts/sync_mapping.sh'
      - '.forgejo/workflows/update-mappings.yml'
      - 'src/PlayniteR2modman/Resources/r2modman_games.json'
      - 'src/PlayniteR2modman/Resources/gale_games.json'
  pull_request:
    paths:
      - 'scripts/update_game_mappings.py'
      - 'scripts/update_gale_game_mappings.py'
      - 'scripts/sync_mapping.sh'
      - 'src/PlayniteR2modman/Resources/r2modman_games.json'
      - 'src/PlayniteR2modman/Resources/gale_games.json'

jobs:
  sync-mappings:
    runs-on: docker
    steps:
      - name: Checkout
        uses: https://code.forgejo.org/actions/checkout@v4

      - name: Mark workspace as safe for git
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "${FORGEJO_WORKSPACE:?}"

      - name: Install Python
        shell: bash
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y python3 python3-pip
          ln -sf /usr/bin/python3 /usr/local/bin/python

      - name: Run extractor
        run: python scripts/update_game_mappings.py

      - name: Sync refreshed mapping
        shell: bash
        env:
          FORGEJO_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
        run: >-
          bash scripts/sync_mapping.sh
          src/PlayniteR2modman/Resources/r2modman_games.json
          scripts/update_game_mappings.py

  sync-gale-mappings:
    runs-on: docker
    # Sequential so the two jobs never push to main at the same time; still
    # runs when the r2modman job fails so a PR reports both drifts.
    needs: sync-mappings
    if: always()
    steps:
      - name: Checkout
        uses: https://code.forgejo.org/actions/checkout@v4

      - name: Mark workspace as safe for git
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "${FORGEJO_WORKSPACE:?}"

      - name: Install Python
        shell: bash
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y python3 python3-pip
          ln -sf /usr/bin/python3 /usr/local/bin/python

      - name: Run extractor
        run: python scripts/update_gale_game_mappings.py

      - name: Sync refreshed mapping
        shell: bash
        env:
          FORGEJO_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
        run: >-
          bash scripts/sync_mapping.sh
          src/PlayniteR2modman/Resources/gale_games.json
          scripts/update_gale_game_mappings.py
